version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: pryvora_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    environment:
      APP_ENV: dev
      APP_SECRET: dev_secret_change_in_production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integration/oauth/callback}
      JARVIS_API_TOKEN: ${JARVIS_API_TOKEN:-}
      JARVIS_USER_EMAIL: ${JARVIS_USER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pryvora_network

  # The assistant. Talks to Symfony over the internal network, so it uses the
  # container port 8000 regardless of whatever the host maps it to.
  jarvis:
    build:
      context: ./jarvis
    container_name: pryvora_jarvis
    ports:
      - "8100:8100"
    volumes:
      - ./jarvis:/app
    # jarvis/.env is the single source for this container's secrets — the API
    # token plus the assistant's own keys. required:false so a fresh clone
    # without it still starts; the service then fails closed on 503 rather than
    # compose refusing to come up at all.
    env_file:
      - path: ./jarvis/.env
        required: false
    environment:
      PRYVORA_API_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pryvora_network

  # Short-term conversation history only. 6379 and 6380 are both already taken
  # on this host, hence 6390 — containers still talk to it on 6379.
  redis:
    image: redis:7-alpine
    container_name: pryvora_redis
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pryvora_network

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile.dev
    container_name: pryvora_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - pryvora_network

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: pryvora_worker
    # Overrides bootstrap.sh so the worker does not race the backend on migrations.
    command: sh -c "until php bin/console dbal:run-sql 'SELECT 1' >/dev/null 2>&1; do sleep 3; done; php bin/console messenger:consume async --time-limit=3600 --memory-limit=192M -vv"
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    environment:
      APP_ENV: dev
      APP_SECRET: dev_secret_change_in_production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integration/oauth/callback}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pryvora_network

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.dev
    container_name: pryvora_scheduler
    # There is no cron in the image and no Redis in this stack, so a plain loop
    # is the simplest 15-minute tick. It only enqueues; the worker does the work.
    command: sh -c "until php bin/console dbal:run-sql 'SELECT 1' >/dev/null 2>&1; do sleep 3; done; while true; do php bin/console app:integrations:sync || true; sleep 900; done"
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    environment:
      APP_ENV: dev
      APP_SECRET: dev_secret_change_in_production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/integration/oauth/callback}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - pryvora_network

  db:
    image: postgres:16-alpine
    container_name: pryvora_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pryvora
      POSTGRES_USER: pryvora
      POSTGRES_PASSWORD: pryvora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pryvora"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pryvora_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: pryvora_elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pryvora_network

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  postgres_data:
  elasticsearch_data:
  redis_data:

networks:
  pryvora_network:
    driver: bridge

