# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    test: ~

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    #esi: true
    #fragments: true

    # Each sync and connection test makes real requests to the remote provider,
    # so the endpoints that trigger them are throttled per user and account.
    # A token bucket allows a small burst, then refills slowly.
    rate_limiter:
        integration_sync:
            policy: 'token_bucket'
            limit: 3
            rate: { interval: '30 seconds', amount: 1 }
        integration_test:
            policy: 'token_bucket'
            limit: 3
            rate: { interval: '30 seconds', amount: 1 }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
